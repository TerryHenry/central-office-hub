<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Office — Diagnostic Shell</title>
  <link rel="stylesheet" href="assets/xterm/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-mode">
  <div class="auth-screen active" id="authRequiredScreen" style="display: none;">
    <div class="auth-card">
      <h1>Sign in required</h1>
      <p class="hint">This is an admin-only feature. <a href="/">Sign in</a>, then open it again from a site's row menu.</p>
    </div>
  </div>

  <div class="terminal-wrap" id="terminalScreen" style="display: none;">
    <div class="terminal-header">
      <span class="title" id="terminalTitle">Connecting…</span>
      <button id="terminalDisconnectBtn" class="secondary">Disconnect</button>
    </div>
    <div id="xtermContainer"></div>
  </div>

  <script src="assets/xterm/xterm.js"></script>
  <script src="shell.js"></script>
</body>
</html>
